# CI for mballance-utils/pyastbuilder on Forgejo Actions.
#
# pyastbuilder is pure Python, so there is one job and one artifact: a
# py3-none-any wheel. Two things differ from the GitHub workflow:
#
#  1. No third-party actions. Bare `uses:` resolves against code.forgejo.org
#     (Forgejo's DEFAULT_ACTIONS_URL), not github.com. Publishing is plain
#     twine so that GitHub is not on the critical path of a release.
#  2. Publishing is tag-gated. The GitHub workflow publishes dev-suffixed
#     wheels off master; releases proper are cut here, from a tag.
name: CI

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Shared build image, reused as-is from psstools/pssparser: manylinux
      # plus node (act runs JS actions such as checkout *inside* the job
      # container) and build tooling in every interpreter. Nothing in it is
      # pssparser-specific. Source: pssparser's .forgejo/ci-image/Dockerfile.
      image: dvkit/pssparser-ci:manylinux_2_28-x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Check for internal identifiers in tracked files
      # This repo is published to git.dvkit.org, so anything committed here is
      # public. Internal host names, tailnet addresses and CGNAT-range IPs must
      # not appear in tracked files -- if a build ever needs one, it belongs in
      # a repository secret, which is masked in logs.
      run: |
        pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
        if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/ci.yml' ; then
          echo "::error::internal identifier found in a tracked file (see matches above)"
          exit 1
        fi
        echo "OK: no internal identifiers in tracked files"

    - name: Stamp build version
      # Tag builds keep the clean BASE version; everything else gets a
      # .<run-id> dev suffix so ordinary pushes can never collide with a
      # release version on PyPI.
      run: |
        case "$GITHUB_REF" in
          refs/tags/*) echo "tag build -- leaving version clean" ;;
          *) sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' src/astbuilder/__version__.py ;;
        esac
        grep '^SUFFIX = ' src/astbuilder/__version__.py

    - name: Build wheel and sdist
      # --no-isolation: the image already carries setuptools/wheel/build, and
      # this keeps the build itself off the network.
      run: |
        P=/opt/python/cp312-cp312/bin/python
        $P -m build --no-isolation
        ls -la dist/

    - name: Upload distributions
      uses: forgejo/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error

    - name: Smoke-test the built wheel
      # Against the installed wheel in a clean venv, never against the source
      # tree -- that is what makes this a test of the artifact we would ship.
      run: |
        for py in cp39-cp39 cp312-cp312 cp313-cp313; do
          echo "=== $py ==="
          /opt/python/${py}/bin/python -m venv /tmp/venv-${py}
          /tmp/venv-${py}/bin/pip install -q dist/*.whl
          /tmp/venv-${py}/bin/astbuilder --help
          /tmp/venv-${py}/bin/python -c "import astbuilder; print(astbuilder.get_version())"
        done

  publish-pypi:
    # Releases only. A tag is the deliberate act; ordinary pushes to master
    # produce dev-suffixed wheels that must never reach PyPI, because a
    # version number there can be yanked but never reused.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    container:
      image: dvkit/pssparser-ci:manylinux_2_28-x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Download distributions
      uses: forgejo/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Check the tag matches the package version
      # Guards against tagging v0.0.3 while __version__.py still says 0.0.2 --
      # which would publish a release under the wrong number, unfixably.
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        base=$(grep '^BASE = ' src/astbuilder/__version__.py | sed 's/.*"\(.*\)".*/\1/')
        echo "tag=$tag  BASE=$base"
        if [ "$tag" != "$base" ]; then
          echo "::error::tag v$tag does not match BASE $base in src/astbuilder/__version__.py"
          exit 1
        fi
        for w in dist/*.whl; do
          case "$(basename "$w")" in
            pyastbuilder-${base}-*) ;;
            *) echo "::error::wheel $(basename "$w") is not version ${base}"; exit 1 ;;
          esac
        done
        echo "OK: tag, source version and all wheels agree on ${base}"

    - name: Publish to PyPI
      # Plain twine rather than a third-party action: this is the release path,
      # and it should not depend on GitHub being reachable.
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::error::PYPI_API_TOKEN is not set for this repository"
          exit 1
        fi
        P=/opt/python/cp312-cp312/bin/python
        $P -m twine check dist/*
        $P -m twine upload --non-interactive --skip-existing dist/*
        echo "published $(ls dist/* | wc -l) distributions"
