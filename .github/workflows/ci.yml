name: CI
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  ci-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Stamp build version
      # Tag builds keep the clean BASE version; everything else gets a
      # .<run-id> dev suffix, which is what the old BUILD_NUM handling in
      # setup.py did.
      run: |
        case "$GITHUB_REF" in
          refs/tags/*) echo "tag build -- leaving version clean" ;;
          *) sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' src/astbuilder/__version__.py ;;
        esac
        grep '^SUFFIX = ' src/astbuilder/__version__.py

    - name: Build wheel and sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Smoke-test the built wheel
      # Against the installed wheel in a clean venv, not the source tree, so
      # this exercises the artifact that would ship.
      run: |
        python -m venv /tmp/venv
        /tmp/venv/bin/pip install -q dist/*.whl
        /tmp/venv/bin/astbuilder --help
        /tmp/venv/bin/python -c "import astbuilder; print(astbuilder.get_version())"

    - name: Publish to PyPi
      if: startsWith(github.ref, 'refs/heads/master')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
