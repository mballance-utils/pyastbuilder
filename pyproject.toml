[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyastbuilder"
description = "Utility for generating AST classes from a yaml description"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
authors = [
    { name = "Matthew Ballance", email = "matt.ballance@gmail.com" },
]
keywords = ["Parsing"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pyyaml",
    "toposort",
]
# Sourced from src/astbuilder/__version__.py, which CI stamps with a dev
# suffix on non-tag builds.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/mballance/pyastbuilder"

[project.scripts]
astbuilder = "astbuilder.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "astbuilder.__version__._pkg_version" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Anchors rootdir here, so the enclosing repo's pytest.ini isn't picked up, and
# puts tests/ on sys.path for the `unit.base_test` imports.
testpaths = ["tests/unit"]
pythonpath = ["tests"]
